name: pqc-scan
description: Find quantum-vulnerable cryptography in your code, key files and endpoints.
author: Yusuf Taha Kurt
branding:
  icon: shield
  color: purple

inputs:
  path:
    description: Directory (relative to the repository) scanned for key files and source code. Empty to skip.
    default: "."
  tls:
    description: Space-separated TLS endpoints (host or host:port). Only endpoints you are allowed to scan.
    default: ""
  ssh:
    description: Space-separated SSH servers (host or host:port).
    default: ""
  exclude:
    description: Space-separated glob patterns to skip, e.g. "tests/fixtures vendor".
    default: ""
  fail-on:
    description: Fail when a finding is at least this severe (BROKEN, VULNERABLE, WEAKENED, UNKNOWN). Empty never fails.
    default: BROKEN
  only-new:
    description: On pull requests, fail only on findings that are new compared with the base branch.
    default: "true"
  format:
    description: Report format saved as an artifact (html, json or cbom).
    default: html
  python-version:
    description: Python version used to run pqc-scan.
    default: "3.12"
  upload-artifact:
    description: Upload the report as a workflow artifact named pqc-scan-report.
    default: "true"
  upload-sarif:
    description: >-
      Upload findings to GitHub code scanning (Security tab). Needs
      "permissions: security-events: write" in the calling workflow.
    default: "false"

outputs:
  report:
    description: Path of the rendered report.
    value: ${{ steps.scan.outputs.report }}
  json:
    description: Path of the JSON report.
    value: ${{ steps.scan.outputs.json }}
  worst-risk:
    description: Worst risk class found (empty if no cryptography was found).
    value: ${{ steps.scan.outputs.worst-risk }}
  sarif:
    description: Path of the SARIF file.
    value: ${{ steps.scan.outputs.sarif }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install pqc-scan
      shell: bash
      run: python -m pip install --quiet "$ACTION_PATH[report]"
      env:
        ACTION_PATH: ${{ github.action_path }}
    - name: Scan
      id: scan
      shell: bash
      run: '"$ACTION_PATH/scripts/github-action.sh"'
      env:
        ACTION_PATH: ${{ github.action_path }}
        PQC_PATH: ${{ inputs.path }}
        PQC_TLS: ${{ inputs.tls }}
        PQC_SSH: ${{ inputs.ssh }}
        PQC_EXCLUDE: ${{ inputs.exclude }}
        PQC_FAIL_ON: ${{ inputs.fail-on }}
        PQC_ONLY_NEW: ${{ inputs.only-new }}
        PQC_FORMAT: ${{ inputs.format }}
        PQC_OUTPUT_DIR: pqc-scan-report
    - name: Upload to code scanning
      if: always() && inputs.upload-sarif == 'true' && steps.scan.outputs.sarif != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: pqc-scan
    - name: Upload report
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: pqc-scan-report
        path: pqc-scan-report
        if-no-files-found: ignore
